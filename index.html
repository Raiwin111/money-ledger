<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="สมุดรายรับรายจ่ายออฟไลน์ ใช้งานได้ทั้งไทยและอังกฤษ พร้อมสรุปยอดรายปีและหลายสกุลเงิน">
  <meta name="theme-color" content="#123f3c">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="สมุดบัญชี">
  <title>สมุดรายรับรายจ่าย · Money Ledger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="aria.skip">ข้ามไปยังเนื้อหาหลัก</a>

  <div class="app-shell">
    <div id="scrim" class="scrim" hidden></div>

    <aside id="sidebar" class="sidebar" aria-label="เมนูหลัก" data-i18n-aria="aria.menu">
      <div class="sidebar__brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32" fill="none" focusable="false">
            <rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor" opacity=".18"/>
            <path d="M9 10.5h14M9 16h10M9 21.5h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="23.5" cy="21.5" r="2.5" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>สมุดรายรับรายจ่าย</strong>
          <span>Money Ledger</span>
        </span>
        <button id="sidebar-close" class="icon-btn sidebar__close" type="button" aria-label="ปิดเมนู" data-i18n-aria="aria.closeSidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <nav class="sidebar__nav" aria-label="เมนูหลัก" data-i18n-aria="aria.menu">
        <a class="nav-item" href="#/dashboard" data-nav="dashboard">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg>
          <span data-i18n="nav.dashboard">ภาพรวม</span>
        </a>
        <a class="nav-item" href="#/transactions" data-nav="transactions">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h14a1 1 0 0 1 1 1v16l-2.5-1.6L15 20.5l-3-1.6-3 1.6-2.5-1.6L4 20.5v-16a1 1 0 0 1 1-1Z"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
          <span data-i18n="nav.transactions">รายการ</span>
        </a>
        <a class="nav-item" href="#/summary" data-nav="summary">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span data-i18n="nav.summary">สรุปปี</span>
        </a>
        <a class="nav-item" href="#/categories" data-nav="categories">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5A2 2 0 0 1 5.5 4.5h4l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-11Z"/><path d="M3.5 10.5h17"/></svg>
          <span data-i18n="nav.categories">หมวดหมู่</span>
        </a>
        <a class="nav-item" href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9c.16.38.53.66.95.72H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.28Z"/></svg>
          <span data-i18n="nav.settings">ตั้งค่า</span>
        </a>
      </nav>

      <div class="sidebar__categories">
        <div class="sidebar__section-head">
          <h2 data-i18n="sidebar.categories">หมวดหมู่</h2>
          <button id="sidebar-add-category" class="icon-btn icon-btn--on-dark" type="button" aria-label="เพิ่มหมวดหมู่" data-i18n-aria="aria.addCategory">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="sidebar-category-groups" class="sidebar__category-groups"></div>
      </div>

      <div class="sidebar__footer">
        <div id="connection-status" class="connection">
          <span class="connection__dot" aria-hidden="true"></span>
          <span data-i18n="settings.offlineReady">พร้อมใช้งานออฟไลน์</span>
        </div>
        <button id="install-btn" class="sidebar__install" type="button" hidden>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
          <span data-i18n="settings.install">ติดตั้งแอป</span>
        </button>
        <span class="sidebar__version" data-i18n="common.localOnly">ข้อมูลอยู่ในเครื่องนี้เท่านั้น</span>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn topbar__menu" type="button" aria-label="เปิดเมนู" data-i18n-aria="aria.openSidebar" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <div class="topbar__heading">
          <h1 id="page-title">ภาพรวม</h1>
          <p id="page-subtitle">ดูรายรับ รายจ่าย และยอดคงเหลือของปีที่เลือก</p>
        </div>

        <div class="topbar__clock" role="timer" aria-live="off" aria-label="นาฬิกาและวันที่ปัจจุบัน" data-i18n-aria="aria.clock">
          <span class="clock__time" id="clock-time">--:--:--</span>
          <span class="clock__date clock__date--long" id="clock-date-long">—</span>
          <span class="clock__date clock__date--short" id="clock-date-short">—</span>
        </div>

        <div class="topbar__actions">
          <button id="lang-toggle" class="chip-btn" type="button" aria-label="เปลี่ยนภาษา" data-i18n-aria="aria.language">EN</button>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="เปลี่ยนโทนสี" data-i18n-aria="aria.theme">
            <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
          </button>
          <button id="quick-add-btn" class="btn btn--primary" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="top.add">เพิ่มรายการ</span>
          </button>
        </div>
      </header>

      <main id="main" class="main" tabindex="-1">
        <section id="view-dashboard" class="view" data-view="dashboard" hidden></section>
        <section id="view-transactions" class="view" data-view="transactions" hidden></section>
        <section id="view-summary" class="view" data-view="summary" hidden></section>
        <section id="view-categories" class="view" data-view="categories" hidden></section>
        <section id="view-settings" class="view" data-view="settings" hidden></section>
      </main>
    </div>
  </div>

  <button id="mobile-add" class="fab" type="button" aria-label="เพิ่มรายการ" data-i18n-aria="top.add">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="tx-dialog" class="dialog" aria-labelledby="tx-dialog-title">
    <form id="tx-form" class="dialog__panel" method="dialog" novalidate>
      <div class="dialog__head">
        <h2 id="tx-dialog-title">เพิ่มรายการ</h2>
        <button class="icon-btn dialog__close" type="button" data-close="tx-dialog" aria-label="ปิด" data-i18n-aria="common.close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="dialog__body">
        <div class="segmented" role="group" aria-label="ประเภท" data-i18n-aria="tx.type">
          <label class="segmented__option">
            <input type="radio" name="tx-type" value="expense" checked>
            <span data-i18n="tx.expense">รายจ่าย</span>
          </label>
          <label class="segmented__option">
            <input type="radio" name="tx-type" value="income">
            <span data-i18n="tx.income">รายรับ</span>
          </label>
        </div>

        <div class="field-row field-row--amount">
          <label class="field field--grow">
            <span class="field__label" data-i18n="tx.amount">จำนวนเงิน</span>
            <input id="tx-amount" class="input input--amount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off" required>
          </label>
          <label class="field field--currency">
            <span class="field__label" data-i18n="tx.currency">สกุลเงิน</span>
            <select id="tx-currency" class="input" name="currency"></select>
          </label>
        </div>

        <label class="field">
          <span class="field__label" data-i18n="tx.category">หมวดหมู่</span>
          <select id="tx-category" class="input" name="category" required></select>
        </label>

        <div class="field-row">
          <label class="field field--grow">
            <span class="field__label" data-i18n="tx.date">วันที่</span>
            <input id="tx-date" class="input" name="date" type="date" required>
          </label>
          <label class="field field--time">
            <span class="field__label" data-i18n="tx.time">เวลา</span>
            <input id="tx-time" class="input" name="time" type="time" step="1" required>
          </label>
        </div>

        <label class="field">
          <span class="field__label"><span data-i18n="tx.note">โน้ต</span> <span class="field__optional" data-i18n="common.optional">ไม่บังคับ</span></span>
          <textarea id="tx-note" class="input input--textarea" name="note" rows="2" maxlength="240" placeholder="เช่น มื้อเที่ยงกับเพื่อน" data-i18n-placeholder="tx.notePlaceholder"></textarea>
        </label>

        <p id="tx-error" class="form-error" role="alert" hidden></p>
        <div id="tx-meta" class="tx-meta" hidden></div>
      </div>

      <div class="dialog__foot">
        <button id="tx-delete" class="btn btn--danger-ghost" type="button" hidden data-i18n="tx.delete">ลบรายการ</button>
        <span class="dialog__spacer"></span>
        <button class="btn btn--ghost" type="button" data-close="tx-dialog" data-i18n="common.cancel">ยกเลิก</button>
        <button class="btn btn--primary" type="submit" data-i18n="common.save">บันทึก</button>
      </div>
    </form>
  </dialog>

  <dialog id="category-dialog" class="dialog dialog--small" aria-labelledby="category-dialog-title">
    <form id="category-form" class="dialog__panel" method="dialog" novalidate>
      <div class="dialog__head">
        <h2 id="category-dialog-title">เพิ่มหมวดหมู่</h2>
        <button class="icon-btn dialog__close" type="button" data-close="category-dialog" aria-label="ปิด" data-i18n-aria="common.close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="dialog__body">
        <label class="field">
          <span class="field__label" data-i18n="categories.type">ประเภท</span>
          <select id="category-type" class="input" name="type">
            <option value="expense" data-i18n="categories.expense">หมวดรายจ่าย</option>
            <option value="income" data-i18n="categories.income">หมวดรายรับ</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="categories.nameTh">ชื่อภาษาไทย</span>
          <input id="category-name-th" class="input" name="nameTh" type="text" maxlength="60" placeholder="เช่น อาหาร" data-i18n-placeholder="categories.nameThPlaceholder" autocomplete="off">
        </label>

        <label class="field">
          <span class="field__label"><span data-i18n="categories.nameEn">ชื่อภาษาอังกฤษ</span> <span class="field__optional" data-i18n="common.optional">ไม่บังคับ</span></span>
          <input id="category-name-en" class="input" name="nameEn" type="text" maxlength="60" placeholder="e.g. Food" data-i18n-placeholder="categories.nameEnPlaceholder" autocomplete="off">
        </label>

        <fieldset class="field color-field">
          <legend class="field__label" data-i18n="categories.color">สี</legend>
          <div id="category-colors" class="color-swatches"></div>
        </fieldset>

        <p id="category-error" class="form-error" role="alert" hidden></p>
      </div>

      <div class="dialog__foot">
        <span class="dialog__spacer"></span>
        <button class="btn btn--ghost" type="button" data-close="category-dialog" data-i18n="common.cancel">ยกเลิก</button>
        <button class="btn btn--primary" type="submit" data-i18n="common.save">บันทึก</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog dialog--tiny" aria-labelledby="confirm-title">
    <div class="dialog__panel">
      <div class="dialog__head">
        <h2 id="confirm-title">ยืนยัน</h2>
        <button class="icon-btn dialog__close" type="button" data-close="confirm-dialog" aria-label="ปิด" data-i18n-aria="common.close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dialog__body">
        <p id="confirm-body" class="confirm-body"></p>
      </div>
      <div class="dialog__foot">
        <span class="dialog__spacer"></span>
        <button id="confirm-cancel" class="btn btn--ghost" type="button" data-close="confirm-dialog" data-i18n="common.cancel">ยกเลิก</button>
        <button id="confirm-ok" class="btn btn--danger" type="button">ยืนยัน</button>
      </div>
    </div>
  </dialog>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
